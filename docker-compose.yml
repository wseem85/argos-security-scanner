services:
  postgres:
    image: postgres
    env_file:
      - backend/worker/.env

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql
  mongo:
    image: mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
volumes:
  postgres_data:
  mongo_data:
